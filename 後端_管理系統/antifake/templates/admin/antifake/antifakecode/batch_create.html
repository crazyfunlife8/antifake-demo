{% extends "admin/base_site.html" %}
{% block title %}批量新增防偽碼{% endblock %}
{% block content %}
<h1>批量新增防偽碼</h1>

{% if messages %}
<ul class="messagelist">
    {% for msg in messages %}
    <li class="{{ msg.tags }}">{{ msg }}</li>
    {% endfor %}
</ul>
{% endif %}

<style>
    .batch-section { background:#f8f8f8; border:1px solid #ddd; border-radius:4px; padding:20px; margin-bottom:24px; }
    .batch-section label { display:block; margin-bottom:4px; font-weight:bold; }
    .batch-section input[type=text], .batch-section input[type=number],
    .batch-section select { width:100%; max-width:400px; padding:6px 8px; box-sizing:border-box; }
    .batch-section .help { color:#888; font-size:12px; margin-top:2px; }
    .submit-row { margin-top:12px; }
</style>

<div class="batch-section">
    <form method="post">
        {% csrf_token %}
        <input type="hidden" name="action" value="generate">
        <div style="margin-bottom:12px;">
            <label>產生數量</label>
            <input type="number" name="count" value="10" min="1" max="10000" required>
        </div>
        <div style="margin-bottom:12px;">
            <label>碼的長度</label>
            <select name="length">
                <option value="12" selected>12 字元（預設）</option>
                <option value="16">16 字元</option>
                <option value="8">8 字元</option>
            </select>
        </div>
        <div style="margin-bottom:12px;">
            <label>共用備註（選填）</label>
            <input type="text" name="notes" placeholder="例：2026Q2 出貨批次">
            <div class="help">這批碼都會套用同一個備註</div>
        </div>
        <div class="submit-row">
            <input type="submit" value="產生並建立" class="default">
        </div>
    </form>
</div>

<a href="../">← 返回防偽碼清單</a>
{% endblock %}
