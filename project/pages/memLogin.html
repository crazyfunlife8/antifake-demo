<div class="lightbox" id="forgetPassowrd">
	<h4 class="h3 title text-bold text-primary">
		<i class="fa fa-exclamation-triangle" aria-hidden="true"></i> 重設密碼
	</h4>
	<div class="form-group">
		<label for="accountText">請輸入您的帳號(電子信箱)</label>
		<input type="text" class="form-control" id="accountText" name="accountText">

<script type="text/javascript">
	$(function() {
		$("#login").click(function() {
			var $form = $("#dataForm");
			if (!$form.valid()) {
				return;
			}
			formSubmit($form, "loginCheck.do");
		});

		$("#register").click(function() {
			redirect("takeMembershipTerms.do");
		});

		$("#confirm").click(function() {
			var $account = $("#accountText", $(".featherlight-content"));
			if ($account.isBlank()) {
				//帳號不可空白;
				alertMsgFront("00-21-001",'帳號');
				$account.focus();
				return;
			}
			doAjax("memForgot.do", {
				"account" : $account.val()
			}, function(json) {
				if (json.data) {
					alertMsgFrontAndReload(json.data, true);
					
					//location.reload();
				} else {
					alertMsgFrontAndReload("MSG_SENT_ACCT_PWD_TMEM_FAIL", true);
				}
			});
		});

		$("#reset").click(function() {
			var $form = $(".featherlight-content");
			var $new = $("#newPassword", $form);
			if ($new.isBlank()) {
				//新密碼為空
				alertMsgFront("00-21-001",'新密碼');
				$new.focus();
				return;
			}
			var $comfirm = $("#confirmPassword", $form);
			if ($comfirm.isBlank()) {
				//驗證新密碼為空
				alertMsgFront("00-21-001",'確認新密碼');
				$comfirm.focus();
				return;
			}
			if ($new.val().length < 4) {
				//密碼長度小於4
				var vals = ['密碼','4'];
				alertMsgFront("00-21-017", vals);
				return;
			}
			if ($new.val() != $comfirm.val()) {
				//新密碼與驗證新密碼不相符
				var vals = ['新密碼','確認新密碼'];
				alertMsgFront("00-21-010", vals);
				return;
			}
			doAjax("memConfirm.do", {
				"vone" : "",
				"password" : $comfirm.val(),
				"vtwo" : ""
			}, function(json) {
				if (json.data) {
					alertInLightbox(json.data);
				}
				redirect("memLogin.do");
			});
		});

		if (JSON.parse("false")) {
			setTimeout(function() {
				$("#openReset").click();
			}, 200);
		} else {
			$("#openReset").remove();
			$("#resetPassowrd").remove();
		}

		if ("0" < 2) {
			$("#validArea").remove();
		}
		$("#account").focus();
	});
	
	function alertMsg(msg, reps) {
		var rex = [ 'A', 'B', 'C', 'D', 'E', 'F', 'G', 'H' ];
		var msgRep = msg;
		if (isNotUndeOrNull(msg)) {
			if (reps != undefined && reps instanceof Array && reps.length > 0) {
				for (var i = 0; i < reps.length; i++) {
					msgRep = msgRep.replace('$' + rex[i], reps[i]);
				}
			} else if (reps != undefined && reps != '') {
				msgRep = msgRep.replace('$A', reps);
			}
		}

		$.featherlight(msgRep, {
			variant : "fixwidth"
		});
	}
	
	function alertMsgFrontAndReload(msg, reload){
		
		if(reload){
			$.featherlight("<div class='lightbox'>" +msg +"</div>", {variant : "fixwidth", afterClose : function(){ window.location.reload(); }});
		} else {
			$.featherlight("<div class='lightbox'>" +msg +"</div>", {variant : "fixwidth" });
		}
	}
	
</script>
