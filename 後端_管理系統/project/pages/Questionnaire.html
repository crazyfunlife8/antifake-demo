		<form class="form3">
			<div class="container form bg-white mgn-t">
				<!-- 題目範本（隱藏，JS 複製用） -->
				<div class="rowTemp" style="display:none">
					<div class="row border">
						<div class="box pd-xl">
							<div class="quesDesc"></div>
							<div class="quesImgList"></div>

			<div class="container bg-white">
				<div class="row">
					<div class="col-lg-12 text-center">
						<a href="javascript:;" id="submit" class="btn btn-primary btn-wdh" onclick="submitForm()">送出</a>
					</div>
				</div>
			</div>

			<script type="text/javascript">
				var multiSelectJSON = '';
				var langType = '{{ lang }}';

				$(function() {
					$.ajax({
						url: "getAllQuestion.do",
						type: "get",
						dataType: "json",
						async: false,
						success: function(json, status) {
							$.each(json.questionList, function(idx, item) {
								var ansMold = item.advQuesVO.ansMold;
								var isCal = item.isCal;
								var options;
								var tmp = $(".rowTemp > .row").clone();
								var prodRltAdvQuesId = item.prodRltAdvQuesId;
								var imgList = item.imgList;
								var $text = '';

								if (imgList) {
									var sliderTemp = $("#sliderTemp").contents().clone();
									$(sliderTemp).attr("id", "slider" + idx);
									$(tmp).find('.quesImgList').append(sliderTemp);
									$(tmp).find("a").attr("href", "#slider" + idx);
									$.each(imgList, function(i, imgHtml) {
										var active = i == 0 ? "active" : "";
										$(tmp).find(".carousel-inner").append('<div class="item ' + active + '">' + imgHtml + '</div>');
									});
									$('.carousel').carousel();
								}

								$(tmp).find('.quesDesc').html(item.advQuesVO.quesDesc);
								if (item.ansQuzIsMust == 1) {
									$(tmp).find('.quesAnsOption').addClass('ansQuzIsMust');
									$(tmp).find('.quesDesc').find("p:last-child").append("<span style='color:red'> *</span>");
								}
								if (ansMold == "4") {
									$(tmp).find('.quesAnsOption').addClass('email');
								}

								$(tmp).find('.quesAnsOption').append('<input type="hidden" name="questObjectList[' + idx + '].prodRltAdvQuesId" value="' + prodRltAdvQuesId + '">');
								$(tmp).find('.quesAnsOption').append('<input type="hidden" name="questObjectList[' + idx + '].detemItem" value="' + item.detemItem + '">');
								$(tmp).find('.quesAnsOption').append('<input type="hidden" name="questObjectList[' + idx + '].ansMold" value="' + ansMold + '">');
								$(tmp).find('.quesAnsOption').append('<input type="hidden" name="questObjectList[' + idx + '].quesDesc" value="' + escape(item.advQuesVO.quesDesc) + '">');
								$(tmp).find('.quesAnsOption').append('<input type="hidden" name="questObjectList[' + idx + '].rightAns" value="' + item.rightAns + '">');

								if (ansMold == "1" || ansMold == "4" || ansMold == "5" || ansMold == "10") {
									if (isCal == 'Y' || ansMold == "5") {
										$(tmp).find('.quesAnsOption').append("<input type='text' readonly class='form-control datepicker' name='questObjectList[" + idx + "].answer'>");
									} else if (ansMold == "10") {
										$(tmp).find('.quesAnsOption').append("<input class='form-control' type='tel' pattern='^[0-9]{1,}([.][0-9]{1,4})?$' name='questObjectList[" + idx + "].answer'>");
									} else {
										$(tmp).find('.quesAnsOption').append("<input class='form-control' type='text' name='questObjectList[" + idx + "].answer'>");
									}
								}

								if (parseInt(item.detemItem) >= 8 || item.detemItem == '5' || item.detemItem == '6') {
									options = item.remarkOptionList;
								} else {
									options = item.quesOptionList;
								}

								if (options) {
									if (ansMold == "6") {
										var select = $("<select class='selectpicker' data-live-search='true' data-title='請選擇' onchange='singleSelectChange(this," + idx + ")'></select>");
									}
									$.each(options, function(index, tmpItem) {
										var optionDesc;
										if (parseInt(item.detemItem) >= 8 || parseInt(item.detemItem) == 5 || parseInt(item.detemItem) == 6) {
											optionDesc = tmpItem;
										} else {
											optionDesc = tmpItem.quesOptDesc;
										}
										if (ansMold == "2") {
											if (optionDesc == "其他" && item.isOthOpt == 'Y') {
												$(tmp).find('.quesAnsOption').append("<div class='radio'><label><input type='radio' name='questObjectList[" + idx + "].radio' onchange='radioTarget($(this).parent().text()," + idx + ")'/>" + optionDesc + "<input type='text' disabled='disabled' class='form-control' id='answer_" + idx + "' onchange='radioKeyup(this," + idx + ")'/></label></div>");
											} else {
												$(tmp).find('.quesAnsOption').append("<div class='radio'><label><input type='radio' name='questObjectList[" + idx + "].radio' onchange='radioTarget($(this).parent().text()," + idx + ")'/>" + optionDesc + "</label></div>");
											}
											$(tmp).find('.quesAnsOption').append("<input type='hidden' name='questObjectList[" + idx + "].answer'>");
										} else if (ansMold == "6") {
											$(select).append("<option value='" + optionDesc + "'>" + optionDesc + "</option>");
											if (optionDesc == "其他" && item.isOthOpt == 'Y') {
												$text = "<input type='text' class='form-control' id='select_" + idx + "' style='max-width:220px; margin-top:20px; display:none' disabled='disabled' onchange='radioKeyup(this," + idx + ")'>";
											}
											$(tmp).find('.quesAnsOption').append("<input type='hidden' name='questObjectList[" + idx + "].answer'>");
										} else if (ansMold == "7") {
											$(tmp).find('.quesAnsOption').append("<div class='checkbox'><label><input type='checkbox' value='" + optionDesc + "' name='questObjectList[" + idx + "].checkbox' onclick='checkboxSetValue(this," + idx + ")'>" + optionDesc + "</label></div>");
										}
									});

									if (ansMold == "6") {
										$(tmp).find('.quesAnsOption').append(select);
										$(tmp).find('.quesAnsOption').append($text);
									}
									if (ansMold == "7") {
										$(tmp).find('.quesAnsOption').append("<input type='hidden' name='questObjectList[" + idx + "].answer'>");
									}
								}

								if (ansMold == "11") {
									var $label = $("<label for='input-folder-1' class='sr-only'>").html("{{ t.label_file_upload }}");
									var $input = $("<input type='file' accept='image/*' capture='environment' class='filestyle' data-placeholder='{{ t.placeholder_no_file }}' onchange='fileUpload(this," + idx + ")'><input type='hidden' name='questObjectList[" + idx + "].answer'>");
									var $div = $("<div class='form-group file'>").append($label).append($input);
									$(tmp).find('.quesAnsOption').append($div);
								}

								$(".form").append(tmp);
							});

							$('.selectpicker').selectpicker();
						}
					});
				});

				function singleSelectChange(item, idx) {
					$("input[name='questObjectList[" + idx + "].answer']").val($(item).val());
					if ($(item).val() == '其他') {
						$("#select_" + idx).attr("disabled", false).show();
					} else {
						$("#select_" + idx).attr("disabled", true).hide();
					}
				}

				function fileUpload(file, idx) {
					if (file.files[0].size > 10000000) {
						alertMsgFront("BIG_FILE_SIZE", 10000, "", "");
						return;
					}
					var formData = new FormData();
					var reader = new FileReader();
					reader.readAsDataURL(file.files[0]);
					reader.onloadend = function(e) {
						var dataUrl = reader.result;
						var base64Result = JSON.stringify(dataUrl.substr(dataUrl.indexOf("base64") + 7));
						formData.append('uploadBase64Img', base64Result);
						formData.append('uploadFileName', file.files[0].name);
						$.ajaxSettings.traditional = true;
						$.ajaxSettings.cache = false;
						$.ajax({
							url: "generic/uploadImg.do",
							data: formData,
							type: "post",
							dataType: "json",
							async: true,
							contentType: false,
							processData: false,
							beforeSend: function() {
								var progressBar = '<div id="bar" class="container" style="top: 80%;position: relative;"><div class="progress" style="height: 15px;"><div class="progress-bar progress-bar-success progress-bar-striped active" role="progressbar" style="width: 0%;">0%</div></div></div>';
								$('#loading').append(progressBar);
								$('#loading').css({ 'opacity': '0.75', 'display': 'block' });
							},
							success: function(json, status) {
								$("input[name='questObjectList[" + idx + "].answer']").val(json.fileNo);
							},
							xhr: function() {
								var myXhr = $.ajaxSettings.xhr();
								if (myXhr.upload) {
									myXhr.upload.addEventListener('progress', function(e) {
										if (e.lengthComputable) {
											var pct = ((e.loaded / e.total) * 100).toFixed(0) + '%';
											$('.progress-bar-success').css('width', pct).text(pct);
										}
									}, false);
								}
								return myXhr;
							},
							error: function() {
								file.value = "";
								alertMsgFront("FORBIDDEN_FILE");
							},
							complete: function() {
								$('#loading').fadeOut(800);
								$('#bar').remove();
							}
						});
					};
				}

				function checkboxSetValue(obj, idx) {
					var str = "";
					var num = 0;
					$(obj).parent().parent().parent().find(":checkbox").each(function(i, item) {
						if ($(item).prop("checked")) {
							if (num > 0) str += "//";
							str += $(item).val();
							num++;
						}
					});
					$("input[name='questObjectList[" + idx + "].answer']").val(str);
				}

				function radioTarget(text, idx) {
					if (text == '其他') {
						$("#answer_" + idx).attr("disabled", false);
						$("input[name='questObjectList[" + idx + "].answer']").val($("#answer_" + idx).val());
					} else {
						$("input[name='questObjectList[" + idx + "].answer']").val(text);
						$("#answer_" + idx).attr("disabled", true);
					}
				}

				function radioKeyup(obj, idx) {
					if (!$(obj).attr("disabled")) {
						$("input[name='questObjectList[" + idx + "].answer']").val($(obj).val());
					}
				}

				function submitForm() {
					var check = true;
					$(".quesAnsOption").not(":first").each(function(idx, item) {
						var ele = $("input[name='questObjectList[" + idx + "].answer']");
						if ($(item).hasClass('ansQuzIsMust') && ele.val() == "") {
							alertMsgFront("{{ t.msg_no_answer }}");
							check = false;
							item.scrollIntoView({ block: "center" });
							return false;
						}
						if ($(item).hasClass('email') && ele.val().length > 0 && !isValidEmail(ele.val())) {
							check = false;
							return false;
						}
					});

					if (check) {
						var formData = getFormData($("form"));
						doAjax("/saveAnswerRecord.do", formData, function(json, status) {
							if (json.finish) {
								location.replace("/mainEntry.do");
							}
						});
					}
				}
			</script>
		</form>

		};
	</script>
