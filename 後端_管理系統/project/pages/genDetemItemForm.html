<script type="text/javascript">

$(function () {
	
	$("#submit").click(function () {
		if(!$("#dataForm").valid()){
			return;
		}
		var formData = getFormData($("#dataForm"));
		doAjax("/saveFormFields.do", formData, function (json) {
			if(json.status){
				if($('#message').text().trim() != ''){
					$.featherlight("#message", {variant : "fixwidth",closeOnClick: false,closeOnEsc: false,beforeOpen:function(){
						this.$instance.find(".featherlight-close").remove();
					}});
				} else{
					window.location.href = "/mainEntry.do";
					return;
				}

			} else{
				alertMsgFront("QKIT_ERR_MSG_001");
				setTimeout(function(){
					window.location.href = "/mainEntry.do"; }, 2000);
			}
			
			
		});
		
		
	});
	
	$("input[type=file]").change(function() {
		var idx = this.name.split('_')[1];
		var $statusEl = $('#upload-status-' + idx);
		$statusEl.text('上傳中...').css('color', '#888');
		$("#submit").prop('disabled', true);
		uploadImg($(this), idx, function(fileNo) {
			document.getElementById('submissionValues['+idx+'].fieldValue').value = fileNo;
			$statusEl.text('✓ 上傳成功').css('color', 'green');
			$("#submit").prop('disabled', false);
		}, function() {
			$statusEl.text('✗ 上傳失敗，請重新選擇').css('color', 'red');
			$("#submit").prop('disabled', false);
		});
	});

	$("input[type=radio]").change(function() {
		var idx = this.name.split('_')[1];
		document.getElementById('submissionValues['+idx+'].fieldValue').value = this.value;
	});

	function uploadImg($file, idx, successFunction, failFunction) {
		if (!$file[0].files || !$file[0].files[0]) {
			failFunction();
			return;
		}
		var filesize = $file[0].files[0].size;
		var fileType = $file[0].files[0].type;
		var patt = /image/i;
		if (filesize > 10000000) {
			alert('檔案太大（上限 10MB），請重新選擇');
			$file[0].value = "";
			failFunction();
			return;
		}
		else if (fileType && !patt.test(fileType)) {
			alert('請選擇圖片檔案');
			$file[0].value = "";
			failFunction();
			return;
		}

		var formData = new FormData();
		$.each($file[0].files, function (i, file) {
			var reader = new FileReader();
			reader.readAsDataURL(file);
			reader.onloadend = function (e) {
				var dataUrl = reader.result;
				var base64Result = JSON.stringify(dataUrl.substr(dataUrl.indexOf("base64") + 7));
				formData.append('uploadBase64Img', base64Result);
				formData.append('uploadFileName', file.name);
				$.ajaxSettings.traditional = true;
				$.ajaxSettings.cache = false;
				$.ajax({
					url: "/generic/uploadImg.do",
					data: formData,
					type: "post",
					dataType: "json",
					async: true,
					contentType: false,
					processData: false,
					beforeSend: function () {
						var progressBar = '<div id="bar" class="container" style="top: 80%;position: relative;"><div class="progress" style="height: 15px;">  <div class="progress-bar progress-bar-success progress-bar-striped active" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="0" style="width: 0%;">0%</div></div></div>';
						$('#loading').append(progressBar);
						$('#loading').css({ 'opacity': '0.75', 'display': 'block' });
					},
					success: function (json, status) {
						if(json.fileNo){
							successFunction(json.fileNo);
						} else{
							$file[0].value = "";
							alert('上傳回應異常，請重試');
							failFunction();
						}
					},
					xhr: function () {
						var myXhr = $.ajaxSettings.xhr();
						if (myXhr.upload) {
							myXhr.upload.addEventListener('progress', function (e) {
								if (e.lengthComputable) {
									$('.progress-bar-success').attr({
										'aria-valuenow': e.loaded,
										'aria-valuemax': e.total,
									});
									$('.progress-bar-success').css('width', ((e.loaded / e.total) * 100).toFixed(0) + '%');
									$('.progress-bar-success').text(((e.loaded / e.total) * 100).toFixed(0) + '%');
								}
							}, false);
						}
						return myXhr;
					},
					error: function (xhr, ajaxOptions, thrownError) {
						$file[0].value = "";
						alert('上傳失敗（HTTP ' + xhr.status + '），請重試');
						failFunction();
					},
					complete: function () {
						$('#loading').fadeOut(800);
						$('#bar').remove();
					}
				});
			};
			reader.onerror = function() {
				alert('無法讀取檔案，請重試');
				failFunction();
			};
		});
	}
	
	
});




</script>
